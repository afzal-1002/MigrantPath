# Shared security-header snippet, `include`d wherever needed (Phase 11 brief §16).
#
# Why a separate include file at all: nginx's own well-documented `add_header`
# inheritance rule is that a location block defining ANY `add_header` of its own
# discards every `add_header` inherited from its parent (server) context entirely -
# not just overrides the one with the same name. A first version of this config set
# these headers once at the server level and assumed every location would inherit
# them; in fact every location that also sets its own Cache-Control (the exact-match
# /index.html block, the hashed-static-assets block, and /api/'s no-store block) was
# silently serving with NO security headers at all - caught by actually curling a real
# running container, not assumed from reading the config. `include`d explicitly in
# every location that defines its own add_header is the correct, if verbose, fix.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# HSTS - only meaningful once actually served over HTTPS (by the TLS-terminating layer
# in front of this container, or by this container itself if it's the TLS terminator -
# see docs/operations/DEPLOYMENT.md). max-age chosen conservatively (~6 months) for a
# first production release rather than the common 2-year figure - short enough to
# recover from a misconfiguration without waiting years, long enough to be meaningful.
# No includeSubDomains: no subdomain topology exists yet to have verified this against.
add_header Strict-Transport-Security "max-age=15768000" always;
