         docs/privacy) blocks both the stylesheet and the font file every time the app

         anywhere in this codebase (grep-verified), so that link fetched a font family

         the CSP to allow a third-party CDN (which would leak every visitor's IP to
         Google on first paint) - `mat.theme(... typography: Roboto ...)` already
         degrades to its own generic sans-serif fallback with no code change needed;
         self-hosting the two weights actually used is a reasonable future
         enhancement, not a blocker, and is left as a disclosed, low-priority known
