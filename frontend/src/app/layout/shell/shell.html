<header class="gov-header">
  <div class="gov-mainbar">
    <div class="gov-mainbar-inner">
      <a routerLink="/" class="gov-brand">
        <span class="gov-brand-mark" aria-hidden="true">FG</span>
        <span class="gov-brand-text">Foreigner Guide</span>
      </a>

      <nav class="gov-tabs" aria-label="Primary">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/procedures" routerLinkActive="active">Procedures</a>
        <a routerLink="/help" routerLinkActive="active">Help</a>
        @if (authService.isAuthenticated()) {
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          @if (isContentAdmin()) {
            <a routerLink="/admin" routerLinkActive="active">Admin</a>
          }
        }
      </nav>

      <div class="gov-mainbar-actions">
        @if (authService.isAuthenticated()) {
          <a routerLink="/account" class="gov-toplink">
            <app-icon name="account" [size]="14" /> My account
          </a>
          <button type="button" class="gov-pill" (click)="logout()">Log out</button>
        } @else {
          <a routerLink="/login" class="gov-toplink">Sign in</a>
          <a routerLink="/register" class="gov-pill">Register</a>
        }
      </div>
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="site-footer">
  <a routerLink="/privacy">Privacy</a>
  <a routerLink="/terms">Terms</a>
  <a routerLink="/cookies">Cookies</a>
  <a routerLink="/disclaimer">Disclaimer</a>
</footer>
