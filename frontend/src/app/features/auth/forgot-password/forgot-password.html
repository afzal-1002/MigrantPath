<mat-card class="auth-card">
  @if (submitted()) {
    <h1>Check your email</h1>
    <p>If an account exists for this email, password reset instructions have been sent.</p>
    <a routerLink="/login">Back to sign in</a>
  } @else {
    <h1>Forgot your password?</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit">Send reset instructions</button>
    </form>
    <p><a routerLink="/login">Back to sign in</a></p>
  }
</mat-card>
