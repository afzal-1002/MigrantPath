<mat-form-field appearance="outline">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    type="text"
    [formControl]="searchControl"
    [matAutocomplete]="auto"
    [attr.aria-busy]="loading()"
    autocomplete="off"
  />
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="optionSelected($event.option.value)">
    @for (country of filteredCountries$ | async; track country.code) {
      <mat-option [value]="country.code">{{ country.name }} ({{ country.code }})</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
