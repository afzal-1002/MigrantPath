# Canonical Phase 15 (Release Readiness) - a real TLS listener in front of the
# unmodified production frontend container, so a real browser (which, unlike curl,
# enforces the Secure cookie attribute) can exercise auth-dependent flows against the
# actual production-built images over genuine HTTPS. This file is never baked into any
# release image - it only exists in this throwaway local Compose overlay
# (docker-compose.local-https.yml). The production frontend's own nginx config
# (frontend/nginx.conf.template) is completely untouched by this - it still only ever
# terminates plain HTTP on 8080, exactly as ADR-013 documents ("fronted by your real
# TLS terminator"); this proxy IS that terminator, for local verification only.
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Real client IP / real scheme forwarded so the backend's `forward-headers-strategy:
    # framework` setting (Spring's own X-Forwarded-* handling, ADR-013) sees a genuine
    # https:// scheme - matching what a real TLS-terminating proxy/load balancer would
    # send in production, so cookies/redirects behave exactly as they would there.
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
