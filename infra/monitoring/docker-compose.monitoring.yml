# Canonical Phase 14 (Observability) - optional, local-only Prometheus + Grafana
# profile. Never referenced by, or merged into, docker-compose.yml/
# docker-compose.prod.yml, and never part of the release/deploy pipeline
# (docs/operations/DASHBOARDS.md). Scrapes a locally-running backend's own
# /actuator/prometheus - start the backend (local or staging profile) first.
#
# Usage:
#   docker compose -f infra/monitoring/docker-compose.monitoring.yml up -d
#   docker compose -f infra/monitoring/docker-compose.monitoring.yml down -v

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: foreigner-warsaw-monitoring-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Lets the container reach a backend running directly on the host
      # (./mvnw spring-boot:run) as well as one running in the main app's own
      # Compose network under its usual service name.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: foreigner-warsaw-monitoring-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
