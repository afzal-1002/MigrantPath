# Production. Same fail-fast-on-missing-config posture as staging, plus API
# documentation endpoints disabled publicly (ARCHITECTURE.md §11 - no sensitive/
# internal endpoints exposed).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  cors:
    allowed-origins: ${FRONTEND_URL}
  auth:
    frontend-base-url: ${FRONTEND_URL}
  token-cleanup:
    enabled: true

server:
  # Trust X-Forwarded-* headers from the reverse proxy in front of this instance
  # (Phase 11 brief §51/§119-§122) so generated redirect/absolute URLs, and Spring
  # Security's isSecure()-conditional HSTS header, correctly see "https" even though
  # the reverse proxy terminates TLS and forwards plain HTTP internally. Safe only
  # because production/staging are deployed so that this instance is never reachable
  # except through that reverse proxy (docs/operations/DEPLOYMENT.md) - the proxy is
  # what's actually responsible for stripping/overwriting any client-supplied
  # X-Forwarded-* header before this ever sees it; this instance itself does not (and
  # architecturally cannot) verify that a "reverse proxy" set these. Deliberately not
  # enabled in local/test, where no reverse proxy sits in front of the app.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true # HTTPS-only environment (ARCHITECTURE.md §13)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
