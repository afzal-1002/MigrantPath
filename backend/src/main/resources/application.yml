# Base configuration shared by every profile. Profile-specific files
# (application-{local,test,staging,production}.yml) only override what genuinely
# differs per environment - see docs/database/DATABASE.md and ARCHITECTURE.md §11.
spring:
  application:
    name: foreigner-warsaw-backend
  lifecycle:
    # How long graceful shutdown (above) waits for in-flight requests before forcing
    # exit - long enough for a normal request, short enough that a deploy doesn't hang.
    timeout-per-shutdown-phase: 20s
  jpa:
    # Flyway owns the schema; Hibernate only ever validates it against the entities.
    # Never create/update here - see ARCHITECTURE.md §4 / IMPLEMENTATION_PLAN.md §8.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Timezone policy (docs/database/DATABASE.md, brief §6): all timestamps are
        # stored and processed in UTC; conversion to a user/UI timezone happens at
        # the presentation layer only, once one exists.
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  session:
    # Server-side sessions persisted in PostgreSQL (ADR-005), not application memory.
    store-type: jdbc
    jdbc:
      # Flyway owns this schema (V5__create_spring_session_jdbc_schema.sql) - Spring
      # Session must never create/alter it itself (ADR-002's rule, applied here).
      initialize-schema: never
    timeout: 30m

server:
  # Graceful shutdown (Phase 11 brief §67): stop accepting new requests, let in-flight
  # ones finish within the timeout below, then exit - so a rolling deploy/restart never
  # cuts off a request mid-flight. Spring Boot's own SmartLifecycle-based
  # implementation, no custom code.
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: SESSION # not the default JSESSIONID - no need to advertise "this is a Java app"
        http-only: true
        same-site: lax # see ADR-005: localhost:4200/localhost:8080 are same-site, so
                        # Lax already covers local cross-origin dev without needing
                        # SameSite=None (which would force Secure, i.e. HTTPS)
        secure: false # overridden to true in staging/production (HTTPS-only there)

management:
  endpoints:
    web:
      exposure:
        # health/info remain the only two endpoints anonymous/unauthenticated callers
        # can ever reach. `prometheus` (Canonical Phase 14 - brief §17) is deliberately
        # in this list too - "exposed" here only means Actuator itself will serve the
        # path *if reached*; SecurityConfig's own permitted-path list (unchanged by
        # this addition) is what actually decides who reaches it, and
        # /actuator/prometheus is NOT in that list - a real, unauthenticated request
        # gets 401 before Actuator's own handler ever runs, exactly like /actuator/env
        # already does (ActuatorExposureTest / PrometheusEndpointSecurityTest).
        include: health,info,prometheus
  metrics:
    tags:
      # A bounded, low-cardinality dimension on every metric (brief §84) - never a
      # per-instance/per-request value.
      application: foreigner-warsaw-backend
  endpoint:
    health:
      # Overridden to "always" in local only - never leak internal component
      # details (datasource URLs, disk paths) publicly.
      show-details: never
      probes:
        # Phase 11 brief §38/§39: explicit liveness/readiness groups
        # (/actuator/health/liveness, /actuator/health/readiness) rather than relying
        # on Spring Boot's own auto-detection (which only enables this automatically
        # inside a detected Kubernetes environment) - the production Dockerfile's own
        # HEALTHCHECK and any orchestrator/reverse-proxy probe both need these to exist
        # regardless of the deployment target (brief §4's "no Kubernetes unless
        # demonstrated need").
        enabled: true
      group:
        readiness:
          # Canonical Phase 14 - a real bug this phase found and fixed: Spring Boot's
          # `readiness` group, by default, includes ONLY its own internal
          # `readinessState` indicator (which tracks graceful-shutdown/startup
          # AvailabilityState, not any actual dependency) - it does NOT automatically
          # fold in `db` or any other registered HealthIndicator. Every prior claim in
          # this codebase's own docs that readiness means "database reachable"
          # (CLAUDE.md, OBSERVABILITY.md, INCIDENT_RESPONSE.md) was therefore wrong in
          # practice: a real, live Postgres outage AFTER startup left
          # `/actuator/health/readiness` reporting UP indefinitely, even though the
          # aggregate `/actuator/health` correctly showed `db: DOWN`. Found via a real
          # production-like verification exercise (stop the actual Postgres container
          # while the app is already serving traffic, hit both endpoints) - every prior
          # failure exercise (Phase 13) only ever tested a DB outage present at
          # *startup*, which fails for an unrelated reason (Flyway/JPA can't
          # initialize, so the process never finishes starting at all) and never
          # exercised this path. `db` is explicitly added below; `mail` is
          # deliberately never added here (see management.health.mail.enabled above -
          # a mail outage must never fail readiness).
          include: readinessState,db
  health:
    mail:
      # A transient SMTP hiccup is not "the application is unhealthy" - it's a
      # degraded external dependency, and it shouldn't make an orchestrator's health
      # check fail the whole app (a well-known health-check anti-pattern). Discovered
      # via a genuinely flaky test run against the Testcontainers Mailpit instance,
      # not assumed - see AbstractIntegrationTest.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  admin-bootstrap:
    # Off everywhere by default (brief §24: "no default admin/admin"). An operator
    # opts in explicitly for exactly one first-deployment startup - see
    # docs/operations/DEPLOYMENT.md - typically via APP_ADMIN_BOOTSTRAP_ENABLED=true
    # plus ADMIN_BOOTSTRAP_EMAIL/ADMIN_BOOTSTRAP_PASSWORD, all unset again afterward.
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
  token-cleanup:
    # Off by default in the base profile (same fail-safe convention admin-bootstrap
    # uses) - turned on explicitly per real environment below, and deliberately never
    # in the test profile, so a scheduled run can never race a test's own assertions
    # against the token tables (see TokenCleanupService's own Javadoc). interval/
    # usedTokenRetention always have real defaults regardless of `enabled`, since the
    # @Scheduled fixedDelayString SpEL expression resolves once at startup either way.
    enabled: ${APP_TOKEN_CLEANUP_ENABLED:false}
    used-token-retention: ${APP_TOKEN_CLEANUP_USED_RETENTION:P1D}
    interval: ${APP_TOKEN_CLEANUP_INTERVAL:PT1H}
  cors:
    # Empty by default - CORS fails safe (denies cross-origin) unless a profile
    # explicitly configures allowed origins. Never "*" (see ARCHITECTURE.md §11 /
    # brief §15).
    allowed-origins: []
  auth:
    frontend-base-url: ${FRONTEND_URL:http://localhost:4200}
    # Verification links are low-risk if intercepted late (they only confirm an email
    # address the recipient already controls) - a day-scale window is generous without
    # being unreasonable (brief §35).
    email-verification-token-ttl: PT24H
    # Reset tokens grant a password change - a much higher-value target if leaked
    # (email forwarding, shared inboxes, delayed reading), so the window is short.
    password-reset-token-ttl: PT30M
    # 5 attempts is generous enough to absorb ordinary typos (brief §21: "do not
    # permanently lock users because of ordinary mistakes") while still bounding a
    # brute-force guess budget.
    max-failed-login-attempts: 5
    lockout-duration: PT15M
    resend-verification-cooldown: PT1M
    forgot-password-cooldown: PT1M
  mail:
    from-address: no-reply@foreignerwarsaw.local
  observability:
    # Canonical Phase 14 (Observability) brief §11 - a request at or above this
    # duration logs at WARN instead of INFO (RequestLoggingFilter). 3s is a generous
    # starting point for a first release with no real production latency baseline yet
    # (docs/operations/METRICS.md marks it INITIAL/TUNING_REQUIRED, not a proven SLO).
    slow-request-threshold-ms: ${APP_SLOW_REQUEST_THRESHOLD_MS:3000}
