# Staging. Every value below is required from the environment - there is no
# fallback, so the application fails fast at startup if a required variable is
# missing rather than silently running with a wrong/insecure default
# (IMPLEMENTATION_PLAN.md 1.7 / brief §5).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  cors:
    allowed-origins: ${FRONTEND_URL}
  auth:
    frontend-base-url: ${FRONTEND_URL}

server:
  servlet:
    session:
      cookie:
        secure: true # HTTPS-only environment (ARCHITECTURE.md §13)
