name: CI

# Validation only, on every PR and push - no deployment (docs/product/
# IMPLEMENTATION_PLAN.md 1.8). Backend integration tests need real PostgreSQL *and*
# Mailpit instances for Testcontainers (as of Phase 2's AbstractIntegrationTest), so
# the backend job runs on a Docker-capable runner (ubuntu-latest ships Docker by
# default) - Windows/macOS runners are not used here specifically because
# Testcontainers-on-Docker is the point being validated. The e2e job additionally
# starts a docker-compose Mailpit/Postgres pair for the real dev-stack Playwright auth
# suite (e2e/auth.spec.ts) - a separate instance from the backend job's throwaway
# Testcontainers one, matching how a developer runs it locally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --no-watch

      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Postgres + Mailpit
        run: docker compose up -d postgres mailpit

      - name: Wait for Postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' foreigner-warsaw-postgres-1 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Postgres did not become healthy in time" >&2
          exit 1

      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: foreigner_warsaw
          DB_USERNAME: foreigner_warsaw
          DB_PASSWORD: foreigner_warsaw_local_dev_only
        run: |
          nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/v1/platform/status > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not become ready in time" >&2
          cat /tmp/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: frontend
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
